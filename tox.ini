[tox]
min_version = 4
requires = tox-uv

[testenv]
package = editable
# The complete suite (every extra) is the default: `tox run -e py311`.
# The mandatory-deps-only profile -- what an HPC user gets -- is opt-in via the
# `core` factor: `tox run -e core-py311`.
deps =
    !core: {env:TOX_TESTENV_DEPS:-r requirements/test-full-python{py_dot_ver}.txt}
    core: {env:TOX_TESTENV_DEPS:-r requirements/test-python{py_dot_ver}.txt}
set_env =
    # Workaround matplotlib on windows server 2012 and gitlab-runner,
    # matplotlib cannot access a registry key and falls back to the WINDIR var
    # https://matplotlib.org/stable/api/font_manager_api.html#matplotlib.font_manager.win32FontDirectory.
    WINDIR = {env:WINDIR:C:\Windows}
    # Use a non GUI rendering backend for matplotlib.
    MPLBACKEND = AGG
    # Define pytest options for using coverage.
    coverage: __COVERAGE_POSARGS=--cov --cov-report=xml --cov-report=html --no-cov-on-fail
pass_env =
    # See gemseo developers docs.
    GEMSEO_KEEP_IMAGE_COMPARISONS
commands =
    pytest {env:__COVERAGE_POSARGS:} {posargs} -k 'not slow'

[testenv:check]
description = run code formatting and checking
basepython = python3.12
deps = -r requirements/check.txt
skip_install = true
allowlist_externals = pre-commit
commands =
    pre-commit install
    pre-commit run --all-files

[testenv:doc]
description = build documentation
basepython = python3.12
deps = -r requirements/doc.txt
set_env =
    {[testenv]set_env}
    DOCSTRING_INHERITANCE_ENABLE = 1
    # plotly's default renderer outside a notebook opens a browser tab
    # (webbrowser.open) instead of rendering non-interactively. Use the
    # renderer built for gallery-style doc builds instead.
    PLOTLY_RENDERER = sphinx_gallery
allowlist_externals =
    rm
    docs/modify_readme_image_url.py
    touch
commands =
    - touch README_tmp.md
    - rm -rf docs/generated
    - rm -rf site
    - python docs/modify_readme_image_url.py
    mkdocs serve {posargs}

[testenv:dist]
description = create and check the pypi distribution
deps =
    check-wheel-contents
    uv
skip_install = true
allowlist_externals = rm
commands =
    rm -rf dist build
    uv build
    # W002: ignore duplicated files.
    check-wheel-contents dist --ignore W002

[testenv:dist-upload]
description = upload existing distribution files to a package repository
skip_install = true
deps = uv
pass_env =
    UV_PUBLISH_TOKEN
    UV_PUBLISH_URL
commands =
    uv publish

[testenv:pypi-py{310,311,312}]
description = test the pypi distribution
deps =
    vimseo[all]
    pytest-xdist
skip_install = true

[testenv:update-deps]
description = update the envs dependencies
set_env =
    __command = uv pip compile pyproject.toml --upgrade --python-platform linux
pass_env =
deps =
    pre-commit
    uv
skip_install = true
commands =
    {env:__command} --group dev --python-version 3.10 -o requirements/test-python3.10.txt
    {env:__command} --group dev --python-version 3.11 -o requirements/test-python3.11.txt
    {env:__command} --group dev --python-version 3.12 -o requirements/test-python3.12.txt
    {env:__command} --all-extras --group dev --python-version 3.10 -o requirements/test-full-python3.10.txt
    {env:__command} --all-extras --group dev --python-version 3.11 -o requirements/test-full-python3.11.txt
    {env:__command} --all-extras --group dev --python-version 3.12 -o requirements/test-full-python3.12.txt
    {env:__command} --all-extras --group doc --python-version 3.12 -o requirements/doc.txt
    uv pip compile --upgrade    --python-version 3.12 -o requirements/check.txt requirements/check.in
    pre-commit autoupdate
