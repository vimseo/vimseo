[lint.isort]
force-single-line = true
#required-imports = ["from __future__ import annotations"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"*.ipynb" = ["unnecessary-assign", "PTH"]
"tests/*.py" = ["D", "pytest-unittest-assertion", "pytest-raises-too-broad", "pytest-unittest-raises-assertion", "PTH"]
"docs/*.py" = [
  "T",
  "D",
  "useless-expression",
  "PTH",
  "line-too-long",
  "PERF",
  "builtin-variable-shadowing",
  "unnecessary-assign",
  "implicit-namespace-package",
]
# ignore docstring that have not yet be converted to the google style
"src/*.py" = ["D"]
"src/vimseo/lib_vimseo/*.*" = ["ALL"]

[format]
docstring-code-format = true
docstring-code-line-length = 88
